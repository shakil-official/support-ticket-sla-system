# Shared settings for app / queue / scheduler
x-app: &app
  build: .
  image: support-ticket-sla:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Web application (also runs migrations + seeders on start)
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8300}:8000"
    environment:
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "${RUN_SEEDERS:-true}"
    # Becomes "healthy" only after migrate/seed finished and the web server answers.
    healthcheck:
      test: [ "CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);\"" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Queue worker: notifications (mail + database), SLA jobs, CSV import
  queue:
    <<: *app
    command: >
      php artisan queue:work redis
      --queue=sla,notifications,default,imports
      --tries=3 --sleep=1 --max-time=3600
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduler: tickets:check-sla every 5 minutes, tickets:auto-close daily
  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is empty - run ./docker/setup.sh first}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is empty - run ./docker/setup.sh first}"
    ports:
      - "${FORWARD_DB_PORT:-3320}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # AOF persistence: queued jobs survive a restart / PC reboot
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches all outgoing mail. UI: http://localhost:8325 (MAILPIT_PORT)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *logging
    environment:
      MP_DATABASE: /data/mailpit.db   # keep captured emails after restart
    ports:
      - "${MAILPIT_PORT:-8325}:8025"
    volumes:
      - mailpit-data:/data

  # DB UI: http://localhost:8380 (ADMINER_PORT)
  adminer:
    image: adminer:latest
    restart: unless-stopped
    logging: *logging
    ports:
      - "${ADMINER_PORT:-8380}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  mailpit-data:
  storage:
